<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Keyhold</title>
    <style>
      :root {
        --ink: #14212b;
        --mut: #5d6b78;
        --line: #dde3e8;
        --bg: #f3f5f7;
        --card: #fff;
        --acc: #0f6b5c;
        --bad: #a63d2f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 12px 24px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 2;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 20px;
        margin: 0 8px 0 0;
        letter-spacing: -0.02em;
      }
      nav {
        display: flex;
        gap: 4px;
        flex: 1;
      }
      nav button {
        border: 0;
        background: none;
        padding: 6px 12px;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
        color: var(--mut);
      }
      nav button.on {
        background: var(--bg);
        color: var(--ink);
        font-weight: 600;
      }
      nav i {
        font-style: normal;
        color: var(--mut);
        font-weight: 400;
      }
      input,
      textarea,
      button {
        font: inherit;
      }
      input,
      textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
      }
      header input {
        width: 220px;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 6px;
        padding: 7px 14px;
        color: var(--ink);
      }
      button.pri {
        background: var(--acc);
        border-color: var(--acc);
        color: #fff;
        font-weight: 600;
      }
      button.dng {
        color: var(--bad);
      }
      button.on {
        background: #e3f1ee;
        border-color: var(--acc);
        color: var(--acc);
      }
      :focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      main {
        padding: 24px;
        max-width: 1200px;
        margin: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 16px;
      }
      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
      }
      .card:hover {
        border-color: var(--acc);
      }
      .card-actions {
        position: absolute;
        z-index: 1;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
      }
      .card-actions button,
      .select-card {
        padding: 4px 7px;
        font-size: 12px;
        background: rgba(255, 255, 255, .94);
        box-shadow: 0 1px 3px rgba(20, 33, 43, .18);
      }
      .select-card {
        display: grid;
        place-items: center;
        width: 29px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .select-card input {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: var(--acc);
      }
      .bulkbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        color: var(--mut);
      }
      .bulkbar label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .bulkbar input {
        width: auto;
        accent-color: var(--acc);
      }
      .bulkbar span {
        flex: 1;
      }
      .view-switch {
        display: flex;
        gap: 4px;
      }
      .view-switch button {
        padding: 5px 9px;
        font-size: 13px;
      }
      .view-switch button[aria-pressed="true"] {
        background: #e3f1ee;
        border-color: var(--acc);
        color: var(--acc);
        font-weight: 600;
      }
      .sort-control {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      .sort-control select {
        width: auto;
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: .5;
      }
      .ph {
        aspect-ratio: 3/2;
        background: #dfe5ea;
      }
      .ph img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .grid.list-view {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .list-view .card {
        display: grid;
        grid-template-columns: 180px 1fr;
        min-height: 120px;
      }
      .list-view .ph {
        aspect-ratio: auto;
        height: 100%;
      }
      .list-view .cb {
        padding-right: 170px;
      }
      .cb {
        padding: 12px 14px;
      }
      .cb b {
        font-size: 18px;
      }
      small,
      .mut {
        color: var(--mut);
      }
      small {
        display: block;
      }
      .sp {
        display: flex;
        gap: 12px;
        margin: 6px 0;
        color: var(--mut);
        font-size: 13px;
        flex-wrap: wrap;
      }
      .ft {
        display: flex;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        margin-top: 8px;
        padding-top: 8px;
        font-size: 13px;
        color: var(--acc);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      th,
      td {
        text-align: left;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        font-size: 13px;
        color: var(--mut);
        font-weight: 500;
      }
      tbody tr {
        cursor: pointer;
      }
      tbody tr:hover {
        background: var(--bg);
      }
      .empty {
        text-align: center;
        padding: 80px 0;
        color: var(--mut);
      }
      dialog {
        border: 0;
        border-radius: 10px;
        padding: 0;
        width: min(560px, 94vw);
        max-height: 90vh;
        color: var(--ink);
      }
      dialog::backdrop {
        background: rgba(20, 33, 43, 0.45);
      }
      #dc {
        padding: 20px 24px;
      }
      .dh {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dh h2 {
        margin: 0;
      }
      .dh button {
        border: 0;
        font-size: 24px;
        line-height: 1;
        padding: 4px 10px;
      }
      .hero {
        width: 100%;
        border-radius: 8px;
        margin-top: 12px;
        max-height: 260px;
        object-fit: cover;
      }
      h3 {
        margin: 18px 0 6px;
        font-size: 15px;
      }
      .fg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }
      .fg label {
        font-size: 13px;
        color: var(--mut);
        display: grid;
        gap: 4px;
      }
      .w2 {
        grid-column: span 2;
      }
      .ar {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 14px 0;
        align-items: center;
      }
      .r {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .match-item.is-peeked .r {
        border-bottom: 0;
      }
      .row-copy {
        flex: 1;
      }
      .listing-row {
        cursor: pointer;
      }
      .listing-row:hover {
        background: #f8fafb;
      }
      .listing-row-actions {
        display: flex;
        gap: 4px;
      }
      .listing-row-actions button {
        padding: 5px 8px;
        font-size: 12px;
      }
      .listing-peek {
        margin: 0 0 8px 66px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #f8fafb;
      }
      .listing-peek .sp {
        margin-top: 0;
      }
      .listing-peek p {
        margin: 6px 0 0;
        font-size: 13px;
      }
      .property-thumb {
        width: 56px;
        height: 42px;
        flex: 0 0 56px;
        border-radius: 5px;
        object-fit: cover;
        background: #dfe5ea;
      }
      .property-thumb--empty {
        display: grid;
        place-items: center;
        color: var(--mut);
        font-size: 20px;
      }
      .sc {
        font-weight: 600;
        color: var(--acc);
      }
      .seg {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      a {
        color: var(--acc);
      }
      @media (max-width: 560px) {
        main {
          padding: 14px;
        }
        header {
          padding: 10px 14px;
        }
        .bulkbar {
          flex-wrap: wrap;
        }
        .bulkbar span {
          display: none;
        }
        .list-view .card {
          grid-template-columns: 110px 1fr;
        }
        .list-view .cb {
          padding-right: 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Keyhold</h1>
      <nav>
        <button data-tab="listings">Listings <i id="n-l"></i></button
        ><button data-tab="contacts">Contacts <i id="n-c"></i></button>
      </nav>
      <input
        id="q"
        type="search"
        placeholder="Search"
        aria-label="Search"
      /><button class="pri" id="add">Add</button>
    </header>
    <main></main>
    <dialog id="dlg"><div id="dc"></div></dialog>
    <script src="parse.js"></script>
    <script src="app.js"></script>
  </body>
</html>
